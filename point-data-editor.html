<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Point & Region Editor • Map Data Editor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b1020;
      --bg-panel: rgba(20, 23, 34, 0.92);
      --bg-panel-solid: #151827;
      --bg-hover: rgba(255, 255, 255, 0.06);
      --bg-input: rgba(255, 255, 255, 0.06);
      --bg-input-hover: rgba(255, 255, 255, 0.09);
      --text-main: #e6e8ef;
      --text-muted: rgba(230, 232, 239, 0.72);
      --border-color: rgba(255, 255, 255, 0.12);
      --border-strong: rgba(255, 255, 255, 0.18);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-glow: rgba(59, 130, 246, 0.35);
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
      --radius: 12px;
      --radius-sm: 10px;
      --spacing: 14px;
      --sidebar-width: 360px;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
      --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.3);
      --focus-ring: 0 0 0 3px var(--accent-glow);
      --header-height: 44px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(1200px 900px at 15% -10%, rgba(59, 130, 246, 0.18), transparent 60%),
        radial-gradient(900px 700px at 110% 110%, rgba(34, 197, 94, 0.12), transparent 55%),
        var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      height: 100vh;
      display: flex;
      overflow: hidden;
      font-size: 13.5px;
      line-height: 1.35;
      color-scheme: dark;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .app-layout {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 6px 0 24px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 10;
      overflow: hidden;
    }

    .sidebar-header {
      padding: var(--spacing);
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-header h1 {
      font-size: 1.1rem;
      margin: 0 0 6px;
    }

    .sidebar-section {
      padding: var(--spacing);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar-section h3 {
      margin: 0;
      font-size: 0.95rem;
    }

    .map-source-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      padding: 2px;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.18);
      margin-bottom: 6px;
    }

    .source-tab {
      text-align: center;
      padding: 8px;
      cursor: pointer;
      color: var(--text-muted);
      font-weight: 600;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 0.9em;
      user-select: none;
    }

    .source-tab:hover {
      background-color: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
    }

    .source-tab.active {
      color: rgba(255, 255, 255, 0.92);
      background: rgba(59, 130, 246, 0.18);
      border-color: rgba(59, 130, 246, 0.35);
      box-shadow: 0 8px 18px rgba(59, 130, 246, 0.12);
    }

    .control-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    input, select, textarea, button {
      font: inherit;
    }

    input[type="text"],
    input[type="number"],
    input[type="search"],
    textarea,
    select {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      color: var(--text-main);
      outline: none;
      transition: border 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    input[type="search"]:focus,
    textarea:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: var(--focus-ring);
      background: var(--bg-input-hover);
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      background: var(--accent);
      border: 1px solid transparent;
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease, background 0.15s ease;
      font-weight: 600;
    }

    button:hover {
      background: var(--accent-hover);
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.2);
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    button.secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    button.danger {
      background: var(--danger);
    }

    button.danger:hover {
      background: #dc2626;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    .tree-list, .nested-tree-list { list-style: none; padding-left: 14px; margin: 0; }
    .tree-list { padding-left: 0; }
    .tree-item {
      cursor: pointer;
      padding: 6px 8px;
      margin: 2px 0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      border: 1px solid transparent;
    }
    .tree-item:hover { background-color: rgba(255, 255, 255, 0.06); color: var(--text-main); }
    .tree-item.active {
      background: rgba(59, 130, 246, 0.16);
      color: var(--text-main);
      border-color: rgba(59, 130, 246, 0.35);
      box-shadow: 0 8px 18px rgba(59, 130, 246, 0.10);
    }
    .tree-item.disabled {
      opacity: 0.6;
      font-style: italic;
      cursor: not-allowed;
    }
    .tree-item.disabled:hover {
      background-color: transparent;
      color: var(--text-muted);
    }

    .tree-folder { padding: 6px 8px; margin: 2px 0; font-weight: 700; color: rgba(255, 255, 255, 0.92); display: flex; align-items: center; border-radius: 10px; }
    .tree-folder:hover { background-color: rgba(255, 255, 255, 0.04); }
    .tree-folder-icon { cursor: pointer; margin-right: 6px; width: 14px; height: 14px; display: inline-block; transition: transform 0.2s; user-select: none; opacity: 0.9; }
    .tree-folder.closed .tree-folder-icon { transform: rotate(-90deg); }
    .tree-folder.closed + .nested-tree-list { display: none; }
    .tree-folder-icon::before { content: "▾"; font-size: 12px; }
    .tree-folder-name { cursor: pointer; }
    .tree-folder-name:hover { text-decoration: none; opacity: 0.95; }
    .tree-folder-name.active { color: rgba(255, 255, 255, 0.92); }

    #server-map-tree {
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.22);
      padding: 8px;
      border-radius: var(--radius);
    }

    .sidebar-footer {
      margin-top: auto;
      padding: var(--spacing);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .summary-stats {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .summary-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .status-bar {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.2);
      font-size: 0.9rem;
    }

    .status-bar.success { color: var(--success); }
    .status-bar.error { color: var(--danger); }
    .status-bar.warning { color: var(--warning); }

    .lists {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 16px;
      overflow: auto;
      height: 100%;
    }

    .list-section {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .list-header h2 {
      margin: 0;
      font-size: 1rem;
    }

    .item-card {
      background: var(--bg-panel-solid);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-soft);
    }

    .item-card h3 {
      margin: 0;
      font-size: 0.95rem;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .card-grid.full {
      grid-template-columns: 1fr;
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .property-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 6px;
      align-items: center;
    }

    .property-row input {
      min-width: 0;
    }

    .remove-property-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 8px;
    }

    .remove-property-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .coords-error {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25);
    }

    .hidden { display: none; }

    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      background: rgba(20, 23, 34, 0.95);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 10px;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .json-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5000;
    }

    .json-modal-content {
      background: var(--bg-panel-solid);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      width: min(900px, 92vw);
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
    }

    .json-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .json-modal-header h3 {
      margin: 0;
      font-size: 1rem;
    }

    .json-modal-textarea {
      flex: 1;
      min-height: 340px;
      background: rgba(0, 0, 0, 0.4);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
    }

    .json-modal-close {
      background: transparent;
      color: var(--text-main);
      font-size: 1.2rem;
      padding: 4px 8px;
      border: none;
      cursor: pointer;
    }

    .json-modal-copy {
      align-self: flex-start;
    }

    @media (max-width: 1100px) {
      .lists {
        grid-template-columns: 1fr;
      }

      .sidebar {
        width: 320px;
      }
    }

    @media (max-width: 860px) {
      .app-layout {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
      }

      .content {
        height: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Point & Region Editor</h1>
        <div style="color: var(--text-muted);">Edit point + region content without loading the map.</div>
      </div>

      <div class="sidebar-section">
        <div class="map-source-tabs">
          <div class="source-tab active" data-source="server">Server Maps</div>
          <div class="source-tab" data-source="local">Local JSON</div>
        </div>

        <div id="source-server-content">
          <div class="control-row">
            <label for="serverMapSearch">Search Server Maps</label>
            <input type="search" id="serverMapSearch" placeholder="Search maps...">
          </div>
          <div class="control-row">
            <button id="refreshMapListBtn" class="secondary" type="button">Refresh Map List</button>
          </div>
          <div id="server-map-tree"></div>
        </div>

        <div id="source-local-content" class="hidden">
          <div class="control-row">
            <label for="jsonFileInput">Load JSON File</label>
            <input type="file" id="jsonFileInput" accept=".json">
          </div>
          <div class="control-row">
            <label for="subMapSelect">Map in File (if multiple)</label>
            <select id="subMapSelect" disabled>
              <option value="">-- Choose a map --</option>
            </select>
          </div>
          <button id="loadSubMapBtn" class="secondary" type="button" disabled>Load Selected Map</button>
        </div>
      </div>

      <div class="sidebar-section">
        <h3>Map Details</h3>
        <div class="control-row">
          <label for="mapId">Map ID</label>
          <input type="text" id="mapId" disabled>
        </div>
        <div class="control-row">
          <label for="mapName">Map Name</label>
          <input type="text" id="mapName" placeholder="Map name">
        </div>
        <div class="control-row">
          <label for="scalePixels">Scale Pixels</label>
          <input type="number" id="scalePixels" min="1" placeholder="Scale Pixels">
        </div>
        <div class="control-row">
          <label for="scaleUnits">Scale Kilometers</label>
          <input type="number" id="scaleUnits" step="0.1" min="0" placeholder="Scale Kilometers">
        </div>
        <div class="control-row">
          <label for="mapBlurb">Blurb</label>
          <textarea id="mapBlurb" placeholder="Short map blurb..."></textarea>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="summary-stats">
          <span>Points: <strong id="points-count">0</strong></span>
          <span>Regions: <strong id="regions-count">0</strong></span>
        </div>
        <div class="summary-actions">
          <button id="viewJsonBtn" disabled>View JSON</button>
          <button id="copyJsonBtn" disabled>Copy JSON</button>
        </div>
      </div>
    </aside>

    <main class="content">
      <div id="status" class="status-bar">Load a map to begin.</div>
      <div class="lists">
        <section class="list-section" aria-label="Points">
          <div class="list-header">
            <h2>Points</h2>
            <button id="addPointBtn" type="button" class="secondary" disabled>Add Point</button>
          </div>
          <div id="pointsList"></div>
        </section>

        <section class="list-section" aria-label="Regions">
          <div class="list-header">
            <h2>Regions</h2>
            <button id="addRegionBtn" type="button" class="secondary" disabled>Add Region</button>
          </div>
          <div id="regionsList"></div>
        </section>
      </div>
    </main>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script>
    const sourceTabs = document.querySelectorAll('.source-tab');
    const sourceServerContent = document.getElementById('source-server-content');
    const sourceLocalContent = document.getElementById('source-local-content');
    const serverMapSearch = document.getElementById('serverMapSearch');
    const serverMapTree = document.getElementById('server-map-tree');
    const refreshMapListBtn = document.getElementById('refreshMapListBtn');
    const jsonFileInput = document.getElementById('jsonFileInput');
    const subMapSelect = document.getElementById('subMapSelect');
    const loadSubMapBtn = document.getElementById('loadSubMapBtn');

    const mapIdInput = document.getElementById('mapId');
    const mapNameInput = document.getElementById('mapName');
    const scalePixelsInput = document.getElementById('scalePixels');
    const scaleUnitsInput = document.getElementById('scaleUnits');
    const mapBlurbInput = document.getElementById('mapBlurb');

    const pointsList = document.getElementById('pointsList');
    const regionsList = document.getElementById('regionsList');
    const pointsCountDisplay = document.getElementById('points-count');
    const regionsCountDisplay = document.getElementById('regions-count');
    const addPointBtn = document.getElementById('addPointBtn');
    const addRegionBtn = document.getElementById('addRegionBtn');
    const viewJsonBtn = document.getElementById('viewJsonBtn');
    const copyJsonBtn = document.getElementById('copyJsonBtn');
    const statusDisplay = document.getElementById('status');
    const toastContainer = document.getElementById('toastContainer');

    let masterMapData = [];
    let currentMapObject = null;
    let collectedPoints = [];
    let collectedRegions = [];
    let serverMapData = [];

    const poiTypeGroups = {
      "Settlements": ["City", "Town", "Village", "Hamlet", "Settlement", "Capital"],
      "Structures": ["Castle", "Fortress", "Fort", "Tower", "Ruin", "Temple", "Shrine", "Mine", "Lighthouse", "Bridge", "Dungeon", "Lair", "Camp", "Asylum", "Landmark"],
      "Natural Features": ["Mountain", "Peak", "Forest", "Wood", "River", "Lake", "Cave", "Cavern", "Coast", "Bay", "Cove", "Swamp", "Marsh", "Desert", "Natural Landmark"],
      "Other": ["Point of Interest", "Region", "Portal"],
      "Unknown": ["Unknown"]
    };

    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      toastContainer.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('visible'));
      setTimeout(() => {
        toast.classList.remove('visible');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function setStatus(message, type = '') {
      statusDisplay.textContent = message;
      statusDisplay.className = `status-bar ${type}`.trim();
    }

    function setSourceTab(source) {
      sourceTabs.forEach(t => t.classList.toggle('active', t.dataset.source === source));
      if (source === 'server') {
        sourceServerContent.classList.remove('hidden');
        sourceLocalContent.classList.add('hidden');
      } else {
        sourceServerContent.classList.add('hidden');
        sourceLocalContent.classList.remove('hidden');
      }
    }

    function filterMapTree(items, query) {
      const q = String(query || '').trim().toLowerCase();
      if (!q) return items;
      const filterRecursive = (item) => {
        if (!item || typeof item !== 'object') return null;
        const name = String(item.name || item.id || '').toLowerCase();
        const children = Array.isArray(item.children) ? item.children : [];
        const filteredChildren = children.map(filterRecursive).filter(Boolean);
        const isMatch = name.includes(q);
        if (isMatch || filteredChildren.length > 0) {
          return { ...item, children: filteredChildren };
        }
        return null;
      };
      return items.map(filterRecursive).filter(Boolean);
    }

    function renderServerMaps(filterText = '') {
      const filtered = filterMapTree(serverMapData, filterText);
      const isFilteredView = !!String(filterText || '').trim();
      renderMapTree(filtered, serverMapTree, { isFilteredView });
    }

    async function fetchServerMaps() {
      serverMapTree.innerHTML = '<div style="padding:10px; text-align:center; color: #888;">Fetching maps...</div>';
      try {
        const response = await fetch('maps/maps.json');
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const maps = await response.json();
        serverMapData = await processMapData(maps);
        renderServerMaps(serverMapSearch ? serverMapSearch.value : '');
        showToast('Map list updated', 'success');
      } catch (e) {
        console.error('Error fetching maps:', e);
        serverMapTree.innerHTML = `<div style="padding:10px; text-align:center; color: var(--danger);">Error loading maps: ${e.message}</div>`;
        showToast('Error loading maps', 'error');
      }
    }

    async function processMapData(maps) {
      const processedMaps = [];
      for (const map of maps) {
        if (map.children && Array.isArray(map.children) && map.children.length > 0 && typeof map.children[0] === 'string') {
          const childIds = map.children;
          map.children = [];
          const childPromises = childIds.map(childId => processChild(childId, 1));
          map.children = await Promise.all(childPromises);
        }
        processedMaps.push(map);
      }
      return processedMaps;
    }

    async function processChild(childId, level = 0) {
      if (level > 5 || !childId || typeof childId !== 'string') {
        return { id: childId, name: String(childId || 'Invalid Child'), status: 'error', error: true };
      }
      try {
        const response = await fetch(`maps/${childId}.json`);
        if (response.ok) {
          const childData = await response.json();
          if (childData.children && Array.isArray(childData.children) && childData.children.length > 0 && typeof childData.children[0] === 'string') {
            const subChildIds = childData.children;
            childData.children = [];
            const subChildPromises = subChildIds.map(subId => processChild(subId, level + 1));
            childData.children = await Promise.all(subChildPromises);
          }
          childData.id = childData.id || childId;
          childData.name = childData.name || childId;
          return childData;
        }
        return { id: childId, name: childId, status: 'coming-soon', error: 'not found' };
      } catch (error) {
        return { id: childId, name: childId, status: 'error', error: error.message };
      }
    }

    async function loadMapDataFromServer(item) {
      if (!item) return;
      if (item.pointsOfInterest || item.regions) {
        masterMapData = [item];
        loadMapData(item);
        return;
      }
      if (!item.id) {
        setStatus('Map data missing ID.', 'error');
        return;
      }
      try {
        const response = await fetch(`maps/${item.id}.json`);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const mapData = await response.json();
        masterMapData = [mapData];
        loadMapData(mapData);
      } catch (e) {
        console.error('Error loading map JSON:', e);
        setStatus(`Error loading map JSON: ${e.message}`, 'error');
      }
    }

    function createTreeItem(item, options = {}) {
      const { isFilteredView = false } = options;
      const li = document.createElement('li');
      const isFolder = item.type === 'folder' || (item.children && item.children.length > 0);
      const isMap = !!item.imageUrl || !!item.pointsOfInterest || !!item.regions;

      if (isFolder) {
        const folderDiv = document.createElement('div');
        folderDiv.className = isFilteredView ? 'tree-folder' : 'tree-folder closed';

        const iconSpan = document.createElement('span');
        iconSpan.className = 'tree-folder-icon';
        iconSpan.onclick = (e) => {
          e.stopPropagation();
          folderDiv.classList.toggle('closed');
        };
        folderDiv.appendChild(iconSpan);

        const nameSpan = document.createElement('span');
        nameSpan.className = 'tree-folder-name';
        nameSpan.textContent = item.name || 'Unnamed';

        if (isMap) {
          nameSpan.title = 'Click to load map data';
          nameSpan.onclick = (e) => {
            e.stopPropagation();
            document.querySelectorAll('.tree-item, .tree-folder-name').forEach(el => el.classList.remove('active'));
            nameSpan.classList.add('active');
            loadMapDataFromServer(item);
          };
        } else {
          nameSpan.onclick = (e) => {
            e.stopPropagation();
            folderDiv.classList.toggle('closed');
          };
        }
        folderDiv.appendChild(nameSpan);
        li.appendChild(folderDiv);

        if (item.children && item.children.length > 0) {
          const nestedUl = document.createElement('ul');
          nestedUl.className = 'nested-tree-list';
          item.children.forEach(child => nestedUl.appendChild(createTreeItem(child, options)));
          li.appendChild(nestedUl);
        }
      } else {
        const mapDiv = document.createElement('div');
        mapDiv.className = 'tree-item';
        mapDiv.textContent = item.name || item.id;

        if (item.status === 'coming-soon' || item.error) {
          mapDiv.classList.add('disabled');
          mapDiv.title = item.error || 'Coming Soon';
        } else {
          mapDiv.onclick = () => {
            document.querySelectorAll('.tree-item, .tree-folder-name').forEach(el => el.classList.remove('active'));
            mapDiv.classList.add('active');
            loadMapDataFromServer(item);
          };
        }
        li.appendChild(mapDiv);
      }
      return li;
    }

    function renderMapTree(items, containerElement, options = {}) {
      containerElement.innerHTML = '';
      const list = document.createElement('ul');
      list.className = 'tree-list';
      items.forEach(item => list.appendChild(createTreeItem(item, options)));
      containerElement.appendChild(list);
    }

    function populateSubMapSelector(mapData) {
      subMapSelect.innerHTML = '<option value="">-- Choose a map --</option>';
      const foundMaps = [];
      function findMapsRecursive(items) {
        if (!items || !Array.isArray(items)) return;
        items.forEach(item => {
          if (item && typeof item === 'object') {
            if (item.imageUrl && item.id && item.name) {
              foundMaps.push({ id: item.id, name: item.name, data: item });
            }
            if (item.children && Array.isArray(item.children)) {
              findMapsRecursive(item.children);
            }
          }
        });
      }
      findMapsRecursive(mapData);
      foundMaps.sort((a, b) => a.name.localeCompare(b.name)).forEach(mapInfo => {
        const option = document.createElement('option');
        option.value = mapInfo.id;
        option.textContent = mapInfo.name;
        subMapSelect.appendChild(option);
      });
      subMapSelect.disabled = foundMaps.length === 0;
      loadSubMapBtn.disabled = foundMaps.length === 0;
    }

    function processFile(file) {
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (Array.isArray(parsed)) {
            masterMapData = parsed;
            populateSubMapSelector(parsed);
            setStatus('Loaded manifest. Select a map to view its points/regions.', 'success');
          } else if (parsed && typeof parsed === 'object') {
            masterMapData = [parsed];
            loadMapData(parsed);
          } else {
            setStatus('Unsupported JSON format.', 'error');
          }
        } catch (e) {
          console.error('JSON parse error:', e);
          setStatus('Invalid JSON file.', 'error');
        }
      };
      reader.onerror = () => setStatus(`Error reading file: ${file.name}`, 'error');
      reader.readAsText(file);
    }

    function handleJsonFileLoad(event) {
      const file = event.target.files[0];
      if (file) processFile(file);
    }

    async function loadMapFromSelector() {
      const selectedMapId = subMapSelect.value;
      if (!selectedMapId) {
        alert('Please select a map from the dropdown.');
        return;
      }
      function findMapById(items, id) {
        for (const item of items) {
          if (item.id === id) return item;
          if (item.children && Array.isArray(item.children)) {
            const found = findMapById(item.children, id);
            if (found) return found;
          }
        }
        return null;
      }
      const mapData = findMapById(masterMapData, selectedMapId);
      if (mapData) {
        loadMapData(mapData);
      } else {
        alert(`Could not find map data for ID: ${selectedMapId}`);
      }
    }

    function normalizePoint(point) {
      return {
        coords: Array.isArray(point.coords) && point.coords.length === 2 ? point.coords.map(n => Math.round(Number(n) || 0)) : [0, 0],
        name: point.name || '',
        pronunciation: point.pronunciation || '',
        type: point.type || 'Unknown',
        description: point.description || '',
        summary: point.summary || '',
        wikiLink: point.wikiLink || '',
        linkedMapId: point.linkedMapId || '',
        properties: point.properties || {}
      };
    }

    function normalizeRegion(region) {
      return {
        id: region.id || `region-${(region.name || 'untitled').toLowerCase().replace(/\s+/g, '-')}`,
        name: region.name || '',
        pronunciation: region.pronunciation || '',
        type: region.type || '',
        value: region.value || '',
        description: region.description || '',
        summary: region.summary || '',
        wikiLink: region.wikiLink || '',
        linkedMapId: region.linkedMapId || '',
        color: region.color || '#3388ff',
        fillColor: region.fillColor || '#3388ff',
        fillOpacity: region.fillOpacity ?? 0.2,
        coordinates: Array.isArray(region.coordinates) ? region.coordinates.map(coord => [Math.round(Number(coord[0]) || 0), Math.round(Number(coord[1]) || 0)]) : [],
        properties: region.properties || {}
      };
    }

    function loadMapData(mapData) {
      if (!mapData) return;
      currentMapObject = mapData;
      mapIdInput.value = mapData.id || '';
      mapNameInput.value = mapData.name || '';
      scalePixelsInput.value = mapData.scalePixels || '';
      scaleUnitsInput.value = mapData.scaleKilometers || mapData.scaleUnits || '';
      mapBlurbInput.value = mapData.blurb || '';

      const points = mapData.pointsOfInterest || mapData.points || [];
      const regions = mapData.regions || [];

      collectedPoints = points.map(normalizePoint);
      collectedRegions = regions.map(normalizeRegion);

      renderPointsList();
      renderRegionsList();
      updateCounts();

      addPointBtn.disabled = false;
      addRegionBtn.disabled = false;
      viewJsonBtn.disabled = false;
      copyJsonBtn.disabled = false;

      setStatus(`Loaded: ${mapData.name || mapData.id || 'Map'}.`, 'success');
      showToast('Map data loaded', 'success');
    }

    function updateCounts() {
      pointsCountDisplay.textContent = collectedPoints.length;
      regionsCountDisplay.textContent = collectedRegions.length;
    }

    function addPropertyRow(container, key = '', value = '') {
      const row = document.createElement('div');
      row.className = 'property-row';

      const keyInput = document.createElement('input');
      keyInput.type = 'text';
      keyInput.className = 'property-key';
      keyInput.placeholder = 'Property Name';
      keyInput.value = key;

      const valueInput = document.createElement('input');
      valueInput.type = 'text';
      valueInput.className = 'property-value';
      valueInput.placeholder = 'Value';
      valueInput.value = value;

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.textContent = 'X';
      removeBtn.className = 'remove-property-btn';
      removeBtn.title = 'Remove this property';
      removeBtn.onclick = () => row.remove();

      row.appendChild(keyInput);
      row.appendChild(valueInput);
      row.appendChild(removeBtn);
      container.appendChild(row);
    }

    function renderProperties(container, properties) {
      container.innerHTML = '';
      if (properties && typeof properties === 'object') {
        Object.keys(properties).forEach(key => {
          addPropertyRow(container, key, properties[key]);
        });
      }
    }

    function collectProperties(container) {
      const properties = {};
      const rows = container.querySelectorAll('.property-row');
      rows.forEach(row => {
        const keyInput = row.querySelector('.property-key');
        const valueInput = row.querySelector('.property-value');
        const key = keyInput.value.trim();
        const value = valueInput.value.trim();
        if (key) properties[key] = value;
      });
      return properties;
    }

    function buildPoiTypeSelect(current) {
      const select = document.createElement('select');
      select.dataset.field = 'type';
      const defaultOption = document.createElement('option');
      defaultOption.value = '';
      defaultOption.textContent = '--Select Type--';
      select.appendChild(defaultOption);
      Object.keys(poiTypeGroups).forEach(groupName => {
        const optgroup = document.createElement('optgroup');
        optgroup.label = groupName;
        poiTypeGroups[groupName].forEach(type => {
          const option = document.createElement('option');
          option.value = type;
          option.textContent = type;
          optgroup.appendChild(option);
        });
        select.appendChild(optgroup);
      });
      select.value = current || '';
      return select;
    }

    function generateCompleteMapData() {
      if (!currentMapObject) {
        alert('No map is currently loaded for saving.');
        return null;
      }

      syncPropertiesFromDom();

      const updatedMasterData = masterMapData && masterMapData.length
        ? JSON.parse(JSON.stringify(masterMapData))
        : [JSON.parse(JSON.stringify(currentMapObject))];

      function findMapByIdRecursive(items, id) {
        for (const item of items) {
          if (item.id === id) return item;
          if (item.children && Array.isArray(item.children)) {
            const found = findMapByIdRecursive(item.children, id);
            if (found) return found;
          }
        }
        return null;
      }

      let mapToUpdate = findMapByIdRecursive(updatedMasterData, currentMapObject.id) || updatedMasterData[0];

      if (!mapToUpdate) {
        alert('Could not find the edited map in the master data structure.');
        return null;
      }

      mapToUpdate.name = mapNameInput.value || mapToUpdate.name || '';
      mapToUpdate.scalePixels = parseInt(scalePixelsInput.value) || mapToUpdate.scalePixels || 3;
      mapToUpdate.scaleKilometers = parseFloat(scaleUnitsInput.value) || mapToUpdate.scaleKilometers || mapToUpdate.scaleUnits || 1;
      mapToUpdate.blurb = mapBlurbInput.value || '';

      const sortedPoints = [...collectedPoints].sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      const sortedRegions = [...collectedRegions].sort((a, b) => (a.name || '').localeCompare(b.name || ''));

      mapToUpdate.pointsOfInterest = sortedPoints.map(p => ({
        coords: p.coords,
        name: p.name || '',
        pronunciation: p.pronunciation || '',
        type: p.type || 'Unknown',
        description: p.description || '',
        summary: p.summary || '',
        wikiLink: p.wikiLink || '',
        linkedMapId: p.linkedMapId || '',
        properties: p.properties || {}
      }));

      mapToUpdate.regions = sortedRegions.map(r => ({
        id: r.id || `region-${(r.name || 'untitled').toLowerCase().replace(/\s+/g, '-')}`,
        name: r.name || '',
        pronunciation: r.pronunciation || '',
        description: r.description || '',
        summary: r.summary || '',
        type: r.type || '',
        value: r.value || '',
        color: r.color || '#3388ff',
        fillColor: r.fillColor || '#3388ff',
        fillOpacity: r.fillOpacity ?? 0.2,
        wikiLink: r.wikiLink || '',
        linkedMapId: r.linkedMapId || '',
        coordinates: r.coordinates || [],
        properties: r.properties || {}
      }));

      const filterGroups = { Regions: {} };
      sortedRegions.forEach(region => {
        if (region.type && region.value) {
          if (!filterGroups.Regions[region.type]) {
            filterGroups.Regions[region.type] = [];
          }
          if (!filterGroups.Regions[region.type].includes(region.value)) {
            filterGroups.Regions[region.type].push(region.value);
          }
        }
      });
      mapToUpdate.filterGroups = filterGroups;

      if (masterMapData.length === 1 && updatedMasterData.length === 1 && masterMapData[0].id === mapToUpdate.id) {
        return mapToUpdate;
      }
      return updatedMasterData;
    }

    function showJsonModal(jsonContent, filename) {
      const existingModal = document.querySelector('.json-modal');
      if (existingModal) document.body.removeChild(existingModal);
      const modal = document.createElement('div');
      modal.className = 'json-modal';
      modal.onclick = (e) => { if (e.target === modal) document.body.removeChild(modal); };
      const modalContent = document.createElement('div');
      modalContent.className = 'json-modal-content';
      const header = document.createElement('div');
      header.className = 'json-modal-header';
      const title = document.createElement('h3');
      title.textContent = filename;
      const closeBtn = document.createElement('button');
      closeBtn.textContent = '×';
      closeBtn.className = 'json-modal-close';
      closeBtn.onclick = () => document.body.removeChild(modal);
      header.appendChild(title);
      header.appendChild(closeBtn);
      const textarea = document.createElement('textarea');
      textarea.className = 'json-modal-textarea';
      textarea.value = jsonContent;
      textarea.readOnly = true;
      const copyBtn = document.createElement('button');
      copyBtn.textContent = 'Copy to Clipboard';
      copyBtn.className = 'json-modal-copy';
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(textarea.value)
          .then(() => { copyBtn.textContent = 'Copied!'; setTimeout(() => copyBtn.textContent = 'Copy to Clipboard', 2000); })
          .catch(err => { console.error('Copy failed: ', err); copyBtn.textContent = 'Copy Failed!'; setTimeout(() => copyBtn.textContent = 'Copy to Clipboard', 2000); });
      };
      modalContent.appendChild(header);
      modalContent.appendChild(textarea);
      modalContent.appendChild(copyBtn);
      modal.appendChild(modalContent);
      document.body.appendChild(modal);
      textarea.focus();
      textarea.select();
    }

    function exportMapData() {
      const finalData = generateCompleteMapData();
      if (!finalData) {
        setStatus('Export failed.', 'error');
        return;
      }
      const jsonString = JSON.stringify(finalData, null, 2);
      showJsonModal(jsonString, 'maps.json');
      setStatus('Complete map data ready to copy from the modal.', 'success');
    }

    function copyCompleteJson() {
      const finalData = generateCompleteMapData();
      if (!finalData) {
        setStatus('Copy failed.', 'error');
        return;
      }
      const jsonString = JSON.stringify(finalData, null, 2);
      navigator.clipboard.writeText(jsonString)
        .then(() => {
          setStatus('Complete map JSON copied!', 'success');
          showToast('Map JSON copied to clipboard!', 'success');
        })
        .catch(err => { setStatus('Failed to copy JSON.', 'error'); console.error('Copy JSON error:', err); });
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    sourceTabs.forEach(tab => tab.addEventListener('click', () => setSourceTab(tab.dataset.source)));

    serverMapSearch.addEventListener('input', () => renderServerMaps(serverMapSearch.value));
    refreshMapListBtn.addEventListener('click', fetchServerMaps);
    jsonFileInput.addEventListener('change', handleJsonFileLoad);
    loadSubMapBtn.addEventListener('click', loadMapFromSelector);

    addPointBtn.addEventListener('click', () => {
      collectedPoints.push(normalizePoint({}));
      renderPointsList();
      updateCounts();
      setStatus('New point added.', 'success');
    });

    addRegionBtn.addEventListener('click', () => {
      collectedRegions.push(normalizeRegion({}));
      renderRegionsList();
      updateCounts();
      setStatus('New region added.', 'success');
    });

    viewJsonBtn.addEventListener('click', exportMapData);
    copyJsonBtn.addEventListener('click', copyCompleteJson);

    fetchServerMaps();
  </script>
</body>
</html>
