name: Pages Build Check

on:
  push:
    branches:
      - pages-static-publish
  pull_request:

jobs:
  validate-pages-bundle:
    name: Validate static Pages bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tile generation tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick webp

      - name: Install dependencies
        run: npm ci

      - name: Validate data and build Pages bundle
        run: npm run validate:pages

      - name: Upload Pages bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-static-bundle
          path: dist

      - name: Summarize Pages bundle
        env:
          PAGES_SUMMARY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/pages_pr_summary.js >> "$GITHUB_STEP_SUMMARY"
