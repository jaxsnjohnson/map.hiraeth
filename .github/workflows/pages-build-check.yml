name: Pages Build Check

on:
  push:
    branches:
      - pages-static-publish
  pull_request:

jobs:
  validate-pages-bundle:
    name: Validate static Pages bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate data and build Pages bundle
        run: npm run validate:pages

      - name: Upload Pages bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-static-bundle
          path: dist
